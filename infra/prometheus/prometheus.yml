global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: amrutam-api
    static_configs:
      - targets: ["api:8000"] # DNS round-robin: one replica per scrape (fleet view)
  - job_name: amrutam-api-replicas
    static_configs:
      - targets:
          - "amrutam_backend-api-1:8000"
          - "amrutam_backend-api-2:8000"
          - "amrutam_backend-api-3:8000"
        labels: { tier: "replica" }
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
