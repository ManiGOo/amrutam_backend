# Docker embedded DNS — re-resolved periodically so --scale/stopped replicas
# join/leave rotation without an nginx reload. Without `resolve`, nginx pins
# the single IP returned at startup and max_fails can never fail over.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api_backend {
    zone api_backend 64k; # shared memory required for runtime `resolve`
    least_conn;
    server api:8000 resolve max_fails=3 fail_timeout=30s;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=user_ip:10m rate=20r/s;
limit_req_zone $http_authorization zone=user_jwt:10m rate=10r/s;

server {
    listen 80;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl http2;
    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        limit_req zone=user_ip burst=50 nodelay;
        limit_req zone=user_jwt burst=20 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503;
    }

    location /health {
        proxy_pass http://api_backend/health;
        access_log off;
    }

    location /docs {
        limit_req zone=user_ip burst=5 nodelay;
        proxy_pass http://api_backend/docs;
    }
}
