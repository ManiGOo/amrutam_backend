[project]
name = "amrutam"
version = "0.1.0"
description = "Amrutam telemedicine backend — production-grade FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "structlog>=24.1",
  "opentelemetry-api>=1.26",
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47",
  "opentelemetry-instrumentation-asyncpg>=0.47",
  "opentelemetry-instrumentation-redis>=0.47",
  "opentelemetry-instrumentation-httpx>=0.47",
  "prometheus-fastapi-instrumentator>=7.0",
  "pyjwt>=2.8",
  "cryptography>=42.0",
  "pyotp>=2.9",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "minio>=7.2",
  "python-multipart>=0.0.9",
  "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "testcontainers>=4.0",
  "schemathesis>=3.27",
  "ruff>=0.4",
  "black>=24.0",
  "mypy>=1.10",
  "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amrutam"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]  # B008: FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # fixture passwords are not secrets

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/amrutam"]
branch = true

[tool.coverage.report]
fail_under = 60
